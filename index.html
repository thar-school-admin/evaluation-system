<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام تقييم الأداء الوظيفي للمعلمات</title>
<style>
    body { font-family: Arial; text-align: center; }
    table { width: 90%; margin: auto; border-collapse: collapse; }
    th, td { border: 1px solid #000; padding: 8px; text-align: center; }
    button { padding: 10px 20px; margin: 20px; font-size: 18px; }
</style>
</head>

<body>

<h2>نظام تقييم الأداء الوظيفي للمعلمات</h2>

<table id="teachersTable">
    <tr>
        <th>اسم المعلمة</th>
        <th>بند 1</th>
        <th>بند 2</th>
        <th>بند 3</th>
        <th>بند 4</th>
        <th>بند 5</th>
        <th>المجموع</th>
        <th>النسبة %</th>
        <th>التقدير</th>
    </tr>

        <td><input type="number" min="0" max="20"></td>

        <td><input type="number" min="0" max="20"></td>
        <td><input type="number" min="0" max="20"></td>
        <td><input type="number" min="0" max="20"></td>
        <td class="total"></td>
        <td class="percent"></td>
        <td class="grade"></td>
    </tr>
</table>

<button onclick="addRow()">➕ إضافة معلمة جديدة</button>
<button onclick="calculateAll()">حساب الدرجات تلقائيًا</button>

<script>
function addRow() {
    let table = document.getElementById("teachersTable");
    let row = table.insertRow(-1);

    for (let i = 0; i < 9; i++) {
        let cell = row.insertCell(i);

        if (i <= 5) {
            cell.innerHTML = '<input type="number" min="0" max="20">';
            if (i === 0) cell.innerHTML = '<input type="text">';
        } else {
            cell.className = (i === 6 ? "total" : i === 7 ? "percent" : "grade");
        }
    }
}
